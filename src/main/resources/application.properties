quarkus.datasource.db-kind=postgresql 
quarkus.datasource.username=admin
quarkus.datasource.password=secret

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:15432/mydb


# Chat model
quarkus.langchain4j.ollama.chat-model.model-name=ollama:latest
quarkus.langchain4j.ollama.chat-model.temperature=0 
quarkus.langchain4j.timeout=60000s 

# Embedding model
quarkus.langchain4j.ollama.embedding-model.model-name=snowflake-arctic-embed:latest